services:
  api:
    build: ./modern-api
    working_dir: /workspace
    entrypoint: ["/bin/sh"]
    command:
      - -lc
      - >-
        if [ ! -f .env ]; then cp .env.example .env; fi;
        grep -q '^DB_HOST=' .env || printf '\nDB_HOST=db\n' >> .env;
        grep -q '^DB_PASSWORD=' .env || printf 'DB_PASSWORD=local-demo-only\n' >> .env;
        composer install --no-interaction;
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi;
        until php -r 'new PDO("pgsql:host=db;port=5432;dbname=bistro_suite", "bistro", "local-demo-only");' 2>/dev/null; do sleep 2; done;
        php artisan migrate --seed --force;
        php artisan storage:link --force;
        php artisan serve --host=0.0.0.0 --port=8000
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bistro_suite
      DB_USERNAME: bistro
      DB_PASSWORD: local-demo-only
      CACHE_STORE: file
      DEMO_ADMIN_EMAIL: admin@demo-bistro.local
      DEMO_ADMIN_PASSWORD: BistroDemo-Local-2026!
    volumes:
      - ./modern-api:/workspace
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bistro_suite
      POSTGRES_USER: bistro
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bistro -d bistro_suite"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: node:24-alpine
    working_dir: /workspace
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_BISTRO_SLUG: demo-bistro
    entrypoint: ["/bin/sh"]
    command:
      - -lc
      - npm ci && npm run dev -- --host 0.0.0.0
    volumes:
      - ../cars-admin-client/modern-web:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  web_node_modules:
  postgres_data:
